<!DOCTYPE html>
<html lang="en">
<head>

        <button id="star-button">⭐</button>
        <button id="clear-button"><svg width="24" height="24" viewBox="30 10 136 175" fill="none" xmlns="http://www.w3.org/2000/svg">
<path fill-rule="evenodd" clip-rule="evenodd" d="M8.05062 24.967H15.4823L19.5274 20.4744L8.60672 10.6414L2.40503 17.5351C2.10393 17.8698 1.93829 18.3047 1.94043 18.7549C1.94254 19.2005 2.13227 19.6247 2.46309 19.9233L8.05062 24.967ZM28.5809 24.967C29.0883 24.967 29.4996 25.3783 29.4996 25.8858V25.8858C29.4996 26.3932 29.0883 26.8045 28.5809 26.8045H7.33495L1.19706 21.2779C0.49848 20.6489 0.0996094 19.6551 0.0996094 18.747C0.0996094 17.8388 0.435874 16.9628 1.04355 16.2879L14.8406 0.964694C15.395 0.349052 16.3434 0.299346 16.959 0.853672L28.3849 11.1416C29.0005 11.6959 29.0502 12.6443 28.4959 13.26L17.9548 24.967H28.5809Z" fill="#E94D43"/>
</svg>
</button>
        <button id="toggle-button">▶</button>
        <button id="sort-button">🔤</button>
    </div>
    <div contenteditable="true" id="text-input"></div>
    <div id="saved-texts">
  
    <div id="linkedin-saved">
        <h2>Saved</h2>
       
        </div>
    </div>
    <div id="statistic">

        <div id="word-count">Words: 0</div>
    </div>
    <script src="script.js"></script>

</html>
